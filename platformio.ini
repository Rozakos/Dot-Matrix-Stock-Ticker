; Dot-Matrix Stock Ticker — ESP32 + 8x MAX7219 (2 rows x 4) FC-16 chain.
; Networking/API layers ported from the sibling CYD-Stock-Ticker project;
; display layer rewritten for MD_Parola (no LVGL/TFT here).

[env:esp32]
platform  = espressif32 @ ^6.7.0
board     = esp32dev
framework = arduino

; min_spiffs leaves room for a larger app image while keeping a small
; LittleFS partition for /settings.json. (Built-in partition CSV.)
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder

build_flags =
  -D CORE_DEBUG_LEVEL=3
  -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
  majicdesigns/MD_Parola          @ ^3.7.3
  majicdesigns/MD_MAX72XX         @ ^3.5.1
  bblanchon/ArduinoJson           @ ^7.2.0
  esp32async/ESPAsyncWebServer    @ ^3.6.0
  esp32async/AsyncTCP             @ ^3.3.2
